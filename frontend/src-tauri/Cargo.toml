[package]
name = "bsk-media-nest"
version = "0.1.0"
description = "A local media catalog that keeps files in their original folders"
authors = ["BSK Media Nest"]
edition = "2021"

[lib]
name = "bsk_media_nest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
